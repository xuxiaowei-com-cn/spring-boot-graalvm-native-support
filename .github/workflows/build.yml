name: build

on:
  push:
    branches:
      - main
      - xuxiaowei/*

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java-version: [ 25 ]
        os:
          - macos-26-intel
          - macos-26
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'graalvm'

      - name: Cache modules
        uses: actions/cache@v5
        id: cache-modules
        with:
          path: |
            ~/.m2/repository
          key: ${{ matrix.os }}-${{ hashFiles('pom.xml', '**/pom.xml', '**/**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ matrix.os }}-

      - name: Maven Version
        run: mvn -v

      - name: Maven native Build
        run: mvn -V -B clean package -Pnative native:compile
